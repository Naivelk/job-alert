name: Job Alert Bot

on:
  schedule:
    # 7:00 a.m., 12:00 m. y 6:00 p.m. hora Colombia (UTC-5) — nada de madrugadas
    - cron: '0 12,17,23 * * *'
  workflow_dispatch:          # botón para correrlo manualmente

permissions:
  contents: write             # para guardar seen.json (no repetir ofertas)

concurrency:
  group: job-alert-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}         # IA (matching + borradores)
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}     # opcional (Colombia)
          CAREERJET_AFFID: ${{ secrets.CAREERJET_AFFID }}   # opcional (agregador Colombia)
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}           # opcional (Google Jobs)
        run: python job_bot.py

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json stats.json matches.json docs/
          git diff --staged --quiet || git commit -m "chore: update state [skip ci]"
          git pull --rebase origin main
          git push
