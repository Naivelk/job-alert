name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verificar sintaxis
        run: python -m compileall -q job_bot.py sources.py ai_match.py config.py weekly_summary.py
      - name: Pruebas de lógica (sin red)
        run: python smoke_test.py
